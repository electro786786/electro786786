<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Mohammed Maajid - Software Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".4"/></pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff41" stop-opacity=".14"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#00ff41" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="win"><rect width="900" height="260" rx="12"/></clipPath>
    <text id="name" x="450" y="150" text-anchor="middle" class="big">MAAJID</text>
  </defs>
  <style>
    .mono{font-family:'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace}
    .big{font-family:'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace;font-size:88px;font-weight:700;letter-spacing:8px}
    .cy{fill:#00e5ff;opacity:.75;animation:g1 3.2s infinite steps(1)}
    .mg{fill:#ff2bd6;opacity:.7;animation:g2 3.2s infinite steps(1)}
    .main{fill:#00ff41;animation:flick 3.2s infinite steps(1)}
    .cur{fill:#00ff41;animation:blink 1s infinite steps(1)}
    @keyframes g1{0%,84%,100%{transform:translate(-2px,0)}86%{transform:translate(-9px,2px)}88%{transform:translate(7px,-3px)}91%{transform:translate(-5px,1px)}94%{transform:translate(6px,0)}97%{transform:translate(-3px,-1px)}}
    @keyframes g2{0%,84%,100%{transform:translate(2px,0)}85%{transform:translate(9px,-2px)}89%{transform:translate(-8px,3px)}92%{transform:translate(5px,0)}95%{transform:translate(-6px,1px)}98%{transform:translate(3px,1px)}}
    @keyframes flick{0%,85%,100%{opacity:1}87%{opacity:.55}90%{opacity:1}93%{opacity:.7}96%{opacity:1}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  </style>

  <g clip-path="url(#win)">
    <rect width="900" height="260" fill="#0a0e0a"/>
    <rect width="900" height="260" fill="url(#glow)"/>

    <!-- title bar -->
    <rect width="900" height="34" fill="#161b22"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="17" r="6" fill="#27c93f"/>
    <text x="450" y="22" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">maajid@github: ~ - zsh</text>

    <!-- glitch name -->
    <use href="#name" class="cy"/>
    <use href="#name" class="mg"/>
    <use href="#name" class="main"/>

    <!-- subtitle -->
    <text x="450" y="192" text-anchor="middle" class="mono" font-size="19" fill="#00ff41" opacity=".9">Software Developer  //  AI  |  Backend  |  Automation</text>

    <!-- prompt -->
    <text x="28" y="240" class="mono" font-size="15" fill="#00ff41">maajid@github:~$ ./build --future</text>
    <rect class="cur" x="322" y="226" width="10" height="17"/>

    <!-- glitch slice -->
    <rect x="0" width="900" height="3" fill="#00ff41" opacity=".22">
      <animate attributeName="y" values="70;130;60;175;110;90;150" dur="2.4s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>

    <!-- scan bar + scanlines -->
    <rect x="0" width="900" height="50" fill="url(#bar)">
      <animate attributeName="y" from="-50" to="260" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect width="900" height="260" fill="url(#scan)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="259" rx="12" fill="none" stroke="#00ff41" stroke-opacity=".4"/>
</svg>
